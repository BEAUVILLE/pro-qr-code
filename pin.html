<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#061b14"/>
  <title>DIGIY QR FACTORY — Accès</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#061b14; --card:#0b2a1f; --line:rgba(255,255,255,.14);
      --text:#eafff1; --muted:rgba(234,255,241,.72);
      --gold:#facc15; --ok:#22c55e; --bad:#fb7185;
      --shadow:0 18px 55px rgba(0,0,0,.45); --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto;
      background:radial-gradient(circle at top, rgba(250,204,21,.10), transparent 55%),
                 linear-gradient(135deg,#04160f,#0a2b1f);
      color:var(--text); padding:18px 18px calc(104px + env(safe-area-inset-bottom,0px));
    }
    .card{
      width:min(520px,92vw);
      background:linear-gradient(145deg,rgba(11,42,31,.96),rgba(6,35,25,.96));
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
    }
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .ico{
      width:46px;height:46px;border-radius:50%;
      display:grid;place-items:center;
      background:radial-gradient(circle at 30% 0,var(--gold),transparent 60%);
      color:#062015;font-weight:1000;
      border:1px solid rgba(250,204,21,.35);
    }
    .t{font-weight:1000;letter-spacing:.12em;font-size:12px}
    .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .pill{
      border:1px solid var(--line);
      background:rgba(250,204,21,.10);
      padding:7px 10px;border-radius:999px;
      font-size:12px;font-weight:900;
    }
    .sep{height:1px;background:var(--line);margin:14px 0}
    label{display:block;font-size:12px;color:var(--muted);margin:8px 0 6px}
    input{
      width:100%; padding:14px 14px;
      border-radius:14px; border:1px solid var(--line);
      background:rgba(0,0,0,.22); color:var(--text);
      font-size:16px; font-weight:900; letter-spacing:.14em;
      outline:none;
    }
    button{
      width:100%; margin-top:12px; padding:14px 14px;
      border-radius:14px; border:none;
      background:linear-gradient(90deg,var(--ok),var(--gold));
      color:#062015; font-weight:1000; font-size:15px;
      cursor:pointer;
    }
    button:disabled{opacity:.6; cursor:not-allowed}
    .msg{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}
    .ok{color:var(--ok); font-weight:900}
    .bad{color:var(--bad); font-weight:900}
    .mini{margin-top:10px; font-size:12px; color:var(--muted); line-height:1.45}
    .mini b{color:var(--text)}

    .bottomNav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:99990;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
      background:rgba(6,27,20,.94);
      border-top:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }
    .bottomNavInner{
      width:min(100%,760px);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:6px;
    }
    .bottomNav a{
      min-height:58px;
      border-radius:16px;
      display:grid;
      place-items:center;
      align-content:center;
      gap:3px;
      color:rgba(234,255,241,.70);
      font-size:11px;
      font-weight:950;
      text-align:center;
      border:1px solid transparent;
      text-decoration:none;
    }
    .bottomNav .ico2{font-size:18px;line-height:1}
    .bottomNav a.active{
      color:#062015;
      background:linear-gradient(135deg,var(--ok),var(--gold));
      border-color:rgba(250,204,21,.28);
      box-shadow:0 12px 26px rgba(34,197,94,.18);
    }
    .quickLinks{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
      margin-top:12px;
    }
    .quickLinks a{
      min-height:40px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:900;
      padding:8px 10px;
    }

  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="ico">🦅</div>
        <div>
          <div class="t" id="title">ACCÈS QR</div>
          <div class="sub" id="subtitle">Chargement…</div>
        </div>
      </div>
      <div class="pill" id="modPill">—</div>
    </div>

    <div class="sep"></div>

    <div class="mini">
      REPÈRE : <b id="slugBox">—</b><br>
      ACTIVITÉ : <b id="realModuleBox">—</b>
    </div>

    <label for="pin">Entre ton code</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="••••" maxlength="8"/>

    <button id="go">🚀 ENTRER</button>

    <div class="quickLinks">
      <a id="quickHome" href="./index.html">🏠 Accueil</a>
      <a id="quickQr" href="./index.html#modGrid">▦ QR</a>
      <a id="quickLinks" href="./index.html#modGrid">🔗 Liens</a>
      <a id="quickMore" href="./index.html#histBody">⚙️ Plus</a>
    </div>

    <div class="msg" id="msg"></div>
  </div>


  <nav class="bottomNav" aria-label="Navigation QR FACTORY">
    <div class="bottomNavInner">
      <a id="bottomHome" href="./index.html"><span class="ico2">🏠</span><span>Accueil</span></a>
      <a id="bottomQr" href="./index.html#modGrid"><span class="ico2">▦</span><span>QR</span></a>
      <a id="bottomLinks" href="./index.html#modGrid"><span class="ico2">🔗</span><span>Liens</span></a>
      <a class="active" id="bottomAccess" href="./pin.html"><span class="ico2">🔐</span><span>Accès</span></a>
      <a id="bottomMore" href="./index.html#histBody"><span class="ico2">⚙️</span><span>Plus</span></a>
    </div>
  </nav>

<script>
(async () => {
  "use strict";

  // =========================
  // SESSION DU MOULE QR PRO
  // =========================
  const MODULE_CODE = "qr_pro";
  const NEXT_URL = "index.html";

  // =========================
  // SUPABASE
  // =========================
  const SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  });

  // =========================
  // UI
  // =========================
  const $ = (id) => document.getElementById(id);
  const msg = (html) => { $("msg").innerHTML = html; };

  $("modPill").textContent = "QR FACTORY";
  $("title").textContent = "ACCÈS QR FACTORY";

  // =========================
  // HELPERS
  // =========================
  const url = new URL(location.href);
  const slug = String(url.searchParams.get("slug") || "").trim().toLowerCase();
  const hintedModule = String(url.searchParams.get("module") || "").trim().toUpperCase();

  $("slugBox").textContent = slug || "—";

  function cleanPin(v){
    return String(v || "").replace(/[^\d]/g, "").slice(0, 8);
  }

  function cleanPhone(v){
    return String(v || "").replace(/[^\d]/g, "").slice(0, 20);
  }

  function cleanModule(v){
    return String(v || "").trim().toUpperCase().replace(/[^A-Z0-9_]/g, "");
  }

  function buildIndexUrl(hash){
    const next = new URL("./index.html", location.href);
    if(slug) next.searchParams.set("slug", slug);
    if(bridge?.module) next.searchParams.set("source_module", bridge.module);
    if(hash) next.hash = hash;
    return next.toString();
  }

  function wireNavLinks(){
    try{
      const home = buildIndexUrl("");
      const qr = buildIndexUrl("modGrid");
      const more = buildIndexUrl("histBody");
      ["quickHome", "bottomHome"].forEach(id => { const n = $(id); if(n) n.href = home; });
      ["quickQr", "quickLinks", "bottomQr", "bottomLinks"].forEach(id => { const n = $(id); if(n) n.href = qr; });
      ["quickMore", "bottomMore"].forEach(id => { const n = $(id); if(n) n.href = more; });
      const access = new URL("./pin.html", location.href);
      if(slug) access.searchParams.set("slug", slug);
      if(hintedModule) access.searchParams.set("module", hintedModule);
      const accessUrl = access.toString();
      const bottomAccess = $("bottomAccess");
      if(bottomAccess) bottomAccess.href = accessUrl;
    }catch(_){}
  }

  function saveSessions(payload){
    const session = {
      slug: payload.slug,
      phone: payload.phone || "",
      owner_id: payload.owner_id || "",
      module: MODULE_CODE,
      source_module: payload.source_module || "",
      ts: Date.now()
    };

    // session universelle
    localStorage.setItem("DIGIY_ACCESS", JSON.stringify({
      slug: session.slug,
      phone: session.phone,
      owner_id: session.owner_id,
      source_module: session.source_module,
      ts: session.ts
    }));

    // session spécifique QR_PRO
    localStorage.setItem("DIGIY_SESSION_" + MODULE_CODE.toUpperCase(), JSON.stringify(session));
  }

  async function resolveSlugBridge(currentSlug){
    const { data, error } = await sb
      .from("digiy_subscriptions_public")
      .select("slug, phone, module")
      .eq("slug", currentSlug)
      .maybeSingle();

    if(error) throw error;

    return {
      slug: String(data?.slug || currentSlug || "").trim().toLowerCase(),
      phone: cleanPhone(data?.phone || ""),
      module: cleanModule(data?.module || hintedModule || "")
    };
  }

  // =========================
  // PRECHECK
  // =========================
  if(!slug){
    $("subtitle").textContent = "Repère manquant";
    $("realModuleBox").textContent = "—";
    msg(`<span class="bad">❌ Repère manquant.</span><br>Reviens depuis le QR généré par la QR Factory.`);
    $("go").disabled = true;
    return;
  }

  $("subtitle").textContent = "Lecture de l’activité…";
  $("realModuleBox").textContent = "…";

  let bridge = null;
  wireNavLinks();

  try{
    bridge = await resolveSlugBridge(slug);

    if(!bridge?.module){
      $("subtitle").textContent = "Activité introuvable";
      $("realModuleBox").textContent = "—";
      msg(`<span class="bad">❌ Activité introuvable pour ce repère.</span><br>Le repère existe peut-être, mais l’activité n’a pas été résolue.`);
      $("go").disabled = true;
      return;
    }

    $("subtitle").textContent = "Accès sécurisé — activité " + bridge.module;
    $("realModuleBox").textContent = bridge.module;
    wireNavLinks();
  }catch(e){
    console.error(e);
    $("subtitle").textContent = "Erreur de lecture";
    $("realModuleBox").textContent = "—";
    msg(`<span class="bad">❌ Erreur de lecture du repère.</span><br>${String(e?.message || e)}`);
    $("go").disabled = true;
    return;
  }

  // auto-focus
  setTimeout(() => $("pin").focus(), 150);

  async function enter(){
    const pin = cleanPin($("pin").value);

    if(pin.length < 3){
      msg(`<span class="bad">❌ Code invalide.</span>`);
      return;
    }

    if(!bridge?.module){
      msg(`<span class="bad">❌ Activité introuvable.</span>`);
      return;
    }

    $("go").disabled = true;
    msg(`Vérification en cours…`);

    const { data, error } = await sb.rpc("digiy_verify_access", {
      p_slug: slug,
      p_pin: pin,
      p_module: bridge.module
    });

    if(error){
      $("go").disabled = false;
      msg(`<span class="bad">❌ Erreur.</span><br>${String(error.message || error)}`);
      return;
    }

    if(!data?.ok){
      $("go").disabled = false;

      if(data?.reason === "module_inactive"){
        msg(
          `<span class="bad">🔒 Module non actif.</span><br>` +
          `Activité détectée : <b>${bridge.module}</b><br>` +
          `<span style="opacity:.85">Activités actives : ${(data.modules_active || []).join(", ")}</span>`
        );
        return;
      }

      msg(`<span class="bad">❌ Accès refusé.</span><br>Code incorrect.`);
      return;
    }

    // ✅ Session QR_PRO sauvée, mais vérifiée sur le vrai rail
    saveSessions({
      slug,
      phone: data.phone || bridge.phone || "",
      owner_id: data.owner_id || "",
      source_module: bridge.module
    });

    msg(`<span class="ok">✅ Accès validé.</span> Ouverture de la QR Factory…`);

    setTimeout(() => {
      location.href = buildIndexUrl("");
    }, 450);
  }

  $("go").addEventListener("click", enter);
  $("pin").addEventListener("keydown", (e) => {
    if(e.key === "Enter") enter();
  });

})();
</script>
</body>
</html>
